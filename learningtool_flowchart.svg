<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #ffffff; stroke: #222222; stroke-width: 1.2; rx: 8; ry: 8; }
    .title { font-family: -apple-system, system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #111111; }
    .label { font-family: -apple-system, system-ui, sans-serif; font-size: 12px; fill: #333333; }
    .arrow { stroke: #555555; stroke-width: 1.1; marker-end: url(#arrowhead); fill: none; }
    .note { font-family: -apple-system, system-ui, sans-serif; font-size: 11px; fill: #666666; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555" />
    </marker>
  </defs>

  <!-- App / Root -->
  <rect x="40" y="40" width="260" height="70" class="box"/>
  <text x="55" y="65" class="title">LearningToolApp</text>
  <text x="55" y="85" class="label">@main, WindowGroup</text>
  <text x="55" y="101" class="label">envObject(CaptionAnalyzer)</text>

  <rect x="340" y="40" width="320" height="70" class="box"/>
  <text x="355" y="65" class="title">ContentView / HomeView.AppRootView</text>
  <text x="355" y="85" class="label">노트 목록 / 선택 → StudyView 진입</text>

  <line x1="300" y1="75" x2="340" y2="75" class="arrow"/>

  <!-- StudyView -->
  <rect x="40" y="150" width="300" height="100" class="box"/>
  <text x="55" y="175" class="title">StudyView</text>
  <text x="55" y="195" class="label">입력: Note</text>
  <text x="55" y="211" class="label">내부: StudyViewModel</text>

  <line x1="500" y1="75" x2="190" y2="150" class="arrow"/>

  <!-- StudyViewModel -->
  <rect x="380" y="150" width="320" height="140" class="box"/>
  <text x="395" y="175" class="title">StudyViewModel</text>
  <text x="395" y="195" class="label">@Published selectedTab</text>
  <text x="395" y="211" class="label">@Published currentNote</text>
  <text x="395" y="227" class="label">@Published selectedKeyword</text>
  <text x="395" y="243" class="label">@Published shouldInsertKeyword</text>
  <text x="395" y="259" class="label">@Published shouldGenerateSuggestions</text>

  <!-- MediaView -->
  <rect x="40" y="320" width="300" height="120" class="box"/>
  <text x="55" y="345" class="title">MediaView</text>
  <text x="55" y="365" class="label">note / videoURL</text>
  <text x="55" y="381" class="label">YouTubeWebViewRepresentable</text>
  <text x="55" y="397" class="label">→ YouTubeWebViewHost(WKWebView)</text>

  <line x1="190" y1="250" x2="190" y2="320" class="arrow"/>

  <!-- CaptionAnalyzer & pipeline -->
  <rect x="380" y="320" width="320" height="170" class="box"/>
  <text x="395" y="345" class="title">CaptionAnalyzer</text>
  <text x="395" y="365" class="label">자막/VTT/TimedText 수집</text>
  <text x="395" y="381" class="label">chapters, summaries, displayKeywords</text>
  <text x="395" y="397" class="label">사용: VTTParser</text>
  <text x="395" y="413" class="label">사용: KeywordExtractor</text>
  <text x="395" y="429" class="label">사용: Summarizer(AppleFM/HTTP)</text>

  <rect x="740" y="320" width="280" height="120" class="box"/>
  <text x="755" y="345" class="title">SummarizerEngine</text>
  <text x="755" y="365" class="label">AppleFMSummarizer (iOS 26+)</text>
  <text x="755" y="381" class="label">또는 HTTPSummarizer</text>
  <text x="755" y="397" class="label">chunk 요약/통합 요약</text>

  <rect x="740" y="460" width="280" height="80" class="box"/>
  <text x="755" y="485" class="title">KeywordExtractor</text>
  <text x="755" y="505" class="label">요약/본문 기반 핵심 키워드 계산</text>

  <line x1="700" y1="380" x2="740" y2="380" class="arrow"/>
  <line x1="700" y1="430" x2="740" y2="500" class="arrow"/>

  <!-- KeywordView -->
  <rect x="40" y="480" width="300" height="120" class="box"/>
  <text x="55" y="505" class="title">KeywordView</text>
  <text x="55" y="525" class="label">analyzer.displayKeywords 표시</text>
  <text x="55" y="541" class="label">KeywordChip (글래스/호버)</text>
  <text x="55" y="557" class="label">→ StudyViewModel.selectKeyword()</text>

  <line x1="340" y1="540" x2="380" y2="430" class="arrow"/>
  <text x="345" y="520" class="note">키워드 선택</text>

  <!-- SummaryView -->
  <rect x="380" y="520" width="300" height="90" class="box"/>
  <text x="395" y="545" class="title">SummaryView</text>
  <text x="395" y="565" class="label">CaptionAnalyzer 요약/챕터 표시</text>

  <!-- QuestionView & Gemini -->
  <rect x="740" y="580" width="320" height="150" class="box"/>
  <text x="755" y="605" class="title">QuestionView</text>
  <text x="755" y="621" class="label">QuestionViewModel</text>
  <text x="755" y="637" class="label">ChatAreaView / ChatBubbleView</text>
  <text x="755" y="653" class="label">QuestionInputBar / SuggestionsSheetView</text>
  <text x="755" y="669" class="label">isGlobalInputActive, keyboard helpers</text>

  <rect x="1100" y="600" width="260" height="110" class="box"/>
  <text x="1115" y="625" class="title">GeminiAPIService</text>
  <text x="1115" y="645" class="label">API Key 관리 (UserDefaults)</text>
  <text x="1115" y="661" class="label">sendMessage(conversationHistory)</text>

  <line x1="1060" y1="655" x2="1100" y2="655" class="arrow"/>
  <text x="950" y="647" class="note">LLM 요청/응답</text>

  <!-- Keyword → Question 플래그 -->
  <line x1="540" y1="290" x2="900" y2="590" class="arrow"/>
  <text x="560" y="310" class="note">selectedKeyword, shouldGenerateSuggestions 바인딩</text>
</svg>