<?xml version="1.0" encoding="UTF-8"?>
<svg width="2200" height="1400" viewBox="0 0 2200 1400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .group-box { fill: #f6f7fb; stroke: #c7ccd8; stroke-width: 1.2; }
    .group-title { font-family: -apple-system, system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #1f2933; }
    .file-box { fill: #ffffff; stroke: #d0d4dd; stroke-width: 1; }
    .file-name { font-family: -apple-system, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #111827; }
    .file-desc { font-family: -apple-system, system-ui, sans-serif; font-size: 9px; fill: #4b5563; }
    .dep-arrow { stroke: #9ca3af; stroke-width: 1; marker-end: url(#arrowhead); fill: none; }
    .dep-label { font-family: -apple-system, system-ui, sans-serif; font-size: 9px; fill: #6b7280; }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
  </defs>

