<?xml version="1.0" encoding="UTF-8"?>
<svg width="2200" height="1400" viewBox="0 0 2200 1400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .group-box { fill: #f6f7fb; stroke: #c7ccd8; stroke-width: 1.2; }
